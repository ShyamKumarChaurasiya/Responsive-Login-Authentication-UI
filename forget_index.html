<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style/forget_style.css">
    
</head>
<body>
    <section class="wrapper">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4 text-center">
                <div class="logo">
                    <img src="./images_login/logo.png" alt="logo" class="img-fluid">
                </div>

                <form class="rounded bg-white shadow p-4 p-sm-5" action="setPassword_index.html">
                    <h3 class="text-dark fw-bolder fs-4 mb-2">Forget Password ?</h3>
                    <div class="fw-normal text-muted mb-3">
                       Enter your email to forget password.
                    </div>

                    <div class="form-floating mb-2">
                        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput">Email address</label>
                    </div>

                    <button type="submit" class="btn btn-primary submit_btn my-4">submit</button>
                    <a href="login_index.html" class="btn btn-secondary submit_btn my-4 ms-3 text-decoration-none">Cancel</a>

                </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
