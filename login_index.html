<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style/login_style.css">
    
</head>
<body>
    <section class="wrapper">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4 text-center">
                <div class="logo">
                    <img src="./images_login/logo.png" alt="logo" class="img-fluid">
                </div>

                <form class="rounded bg-white shadow p-4 p-sm-5" action="#">
                    <h3 class="text-dark fw-bolder fs-4 mb-2">Sign In to Foodies</h3>
                    <div class="fw-normal text-muted mb-4">
                        New Here? <a href="signup_index.html" class="text-primary fw-bold text-decoration-none">Create an Account</a>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput">Email address</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword">Password</label>
                    </div>

                    <div class="mt-2 text-end">
                        <a href="forget_index.html" class="text-primary fw-bold text-decoration-none">Forget Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary submit_btn w-100 my-4">Continue</button>

                    <div class="text-center text-muted text-uppercase mb-3">or</div>

                    <a href="#" class="btn btn-light login_with w-100 mb-3">
                        <img src="./images_login/google-icon.svg" class="img-fluid me-3">Continue with Google</a>

                    <a href="#" class="btn btn-light login_with w-100 mb-3">
                        <img src="./images_login/facebook-icon.svg" class="img-fluid me-3">Continue with Facebook</a>

                    <a href="#" class="btn btn-light login_with w-100 mb-3">
                        <img src="./images_login/linkedin-icon.svg" class="img-fluid me-3">Continue with Linkedin</a>
                        
                </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
