<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style/setPassword_style.css">
    
</head>
<body>
    <section class="wrapper">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4 text-center">
                <div class="logo">
                    <img src="./images_login/logo.png" alt="logo" class="img-fluid">
                </div>

                <form class="rounded bg-white shadow p-4 p-sm-5" action="OTP_Verification_index.html">
                    <h3 class="text-dark fw-bolder fs-4 mb-2">Setup New Password</h3>
                    <div class="fw-normal text-muted mb-3">
                        Already have reset your password ? <a href="login_index.html" class="text-primary fw-bold text-decoration-none"> Sign in</a>
                    </div>

                    

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword">Password</label>
                    </div>
                    <div class="password-info mt-n2 mb-3 text-start">
                        Use 8 or more characters with a mix of Letters, Numbers & Symbols.
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="floatingConformPassword" placeholder="Password">
                        <label for="floatingConformPassword">Confirm Password</label>
                    </div>

                    <div class="form-check text-start mb-3">
                        <input class="form-check-input" type="checkbox" id="gridCheck" checked>
                        <label class="form-check-label ms-2" for="gridCheck">
                          I agree with <a href="#">Terms and conditions.</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary submit_btn my-4">submit</button>

                </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
