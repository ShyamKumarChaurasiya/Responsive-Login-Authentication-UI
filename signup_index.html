<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style/signup_style.css">
    
</head>
<body>
    <section class="wrapper">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4 text-center">
                <div class="logo">
                    <img src="./images_login/logo.png" alt="logo" class="img-fluid">
                </div>

                <form class="rounded bg-white shadow p-4 p-sm-5" action="login_index.html">
                    <h3 class="text-dark fw-bolder fs-4 mb-2">Create an Account</h3>
                    <div class="fw-normal text-muted mb-2">
                        Already have an Account? <a href="login_index.html" class="text-primary fw-bold text-decoration-none"> Sign in here</a>
                    </div>

                    <div class="text-center text-muted text-uppercase mb-2">or</div>
                    
                    <a href="#" class="btn btn-light login_with w-100 mb-3">
                        <img src="./images_login/google-icon.svg" class="img-fluid me-3">Sign in with Google</a>
                    
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingFirstName" placeholder="Sita Ram">
                        <label for="floatingFirstName">First Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingLastName" placeholder="Raghubansi">
                        <label for="floatingLastName">Last Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput">Email address</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword">Password</label>
                    </div>
                    <div class="password-info mt-n2 mb-3 text-start">
                        Use 8 or more characters with a mix of Letters, Numbers & Symbols.
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingConformPassword" placeholder="Password">
                        <label for="floatingConformPassword">Confirm Password</label>
                    </div>

                    <div class="form-check text-start mb-3">
                        <input class="form-check-input" type="checkbox" id="gridCheck" checked>
                        <label class="form-check-label ms-2" for="gridCheck">
                          I agree with <a href="#">Terms and conditions.</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary submit_btn w-100 my-4">Continue</button>

                </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
